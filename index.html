<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotionAI - Intelligent Motion Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>MotionAI</h1>

        <p>Intelligent Motion Detection System</p>

        <!-- CAMERA SECTION -->
        <div class="camera-box">

            <video
                id="camera"
                autoplay
                playsinline
                muted>
            </video>

            <canvas id="motionCanvas"></canvas>

        </div>

        <!-- STATUS -->
        <h2 id="status" aria-live="polite">
            System Ready
        </h2>

        <!-- SENSITIVITY CONTROL -->
        <div class="sensitivity-box">

            <h3>Motion Sensitivity</h3>

            <input
                type="range"
                id="sensitivity"
                min="1"
                max="10"
                value="5"
                aria-label="Motion Sensitivity">

            <p>
                Sensitivity:
                <span id="sensitivityValue">5</span>
            </p>

        </div>

        <!-- CAMERA CONTROLS -->
        <button type="button" id="startBtn">
            Start Detection
        </button>

        <button type="button" id="stopBtn">
            Stop Detection
        </button>

        <!-- MOTION COUNTER -->
        <p>
            Motion Events:
            <span id="counter">0</span>
        </p>

    </div>

    <script src="script.js"></script>

</body>

        </html>
